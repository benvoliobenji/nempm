[package]
name = "nempm-core"
description = "Download, verify and install packages onto removable drives. No UI dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
regex = "1"
# Same TLS setup as tauri-plugin-updater: rustls with the ring provider, so the
# app ships one TLS stack and needs no CMake/NASM toolchain to build.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "time", "sync"] }
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }
url = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
sha2 = "0.10"
hex = "0.4"

[lints]
workspace = true
