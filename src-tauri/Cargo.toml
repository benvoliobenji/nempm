[package]
name = "pkgmgr"
description = "Nemesis Package Manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "pkgmgr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
pkgmgr-core = { path = "../crates/pkgmgr-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-process = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14"
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }
window-vibrancy = "0.8"

[lints]
workspace = true
